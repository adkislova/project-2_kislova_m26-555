[project]
name = "primitive-db"
version = "0.1.0"
description = "Учебная CLI-база данных: управление таблицами, CRUD-операции, декораторы"
readme = "README.md"
authors = [
    { name = "nastayirshenko", email = "nastayirshenko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "poetry>=2.5.1",
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main" 

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__", "data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
